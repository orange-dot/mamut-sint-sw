bloom = 0.36
heat = 0.44
ruin = 0.32
swarm = 0.34

[macro_response.gravitacija]
sensitivity = 1.22
curve = "late_rise"
softness = 0.48

[macro_response.bloom]
sensitivity = 0.92
curve = "soft_plus"
softness = 0.46

[macro_response.heat]
sensitivity = 1.00
curve = "linear"
softness = 0.30

[macro_response.ruin]
sensitivity = 0.94
curve = "early_rise"
softness = 0.22

[macro_response.swarm]
sensitivity = 0.90
curve = "soft_plus"
softness = 0.38

[identity_bias]
horizont_bias = 0.04
pec_bias = 0.18
baklja_bias = 0.10
gravitacija_pressure_bias = 0.30
rupture_threshold_bias = -0.08
body_focus_bias = 0.16

[performance_response]
