# Factory bank pass, scripted — one short phrase skeleton per live slot.
#
# Synthetic development evidence (mamut-seq virtual port). Steps through all
# eight locked factory slots via program change 0..7 and plays a short phrase on
# each, per docs/factory-bank-listening-checklist.md. Program numbers map to the
# locked live set: 0 molten-horizon, 1 cathedral-bloom, 2 ember-vault,
# 3 razor-thaw, 4 gravity-wake, 5 furnace-choir, 6 granite-plain, 7 glass-tide.

schema_version = 1
name = "factory-bank-pass"
description = "Program change 0..7 with a short phrase per locked factory slot."
channel = 2

# --- slot 0: molten-horizon (opener / demo body) ---
[[timeline]]
kind = "section"
name = "slot-0-molten-horizon"

[[timeline.steps]]
kind = "program_change"
program = 0

[[timeline.steps]]
kind = "wait"
ms = 300

[[timeline.steps]]
kind = "chord"
notes = [45, 52, 57, 60]
velocity = 100
duration_ms = 2500

[[timeline.steps]]
kind = "wait"
ms = 2800

