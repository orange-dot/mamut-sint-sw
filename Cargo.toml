[workspace]
members = [
    "crates/mamut-params",
    "crates/mamut-patch",
    "crates/mamut-identity",
    "crates/mamut-dsp",
    "crates/mamut-field",
    "crates/mamut-engine",
    "crates/mamut-standalone",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
alsa = "0.9.1"
anyhow = "1.0.100"
crossbeam-queue = "0.3.12"
eframe = "0.31.1"
midir = "0.10.3"
rtrb = "0.3.3"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.8.23"

mamut-dsp = { path = "crates/mamut-dsp" }
mamut-engine = { path = "crates/mamut-engine" }
mamut-field = { path = "crates/mamut-field" }
mamut-identity = { path = "crates/mamut-identity" }
mamut-params = { path = "crates/mamut-params" }
mamut-patch = { path = "crates/mamut-patch" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unwrap_used = "warn"
